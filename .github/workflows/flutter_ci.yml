name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Test, Lint & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-version.txt
          channel: stable
          cache: true

      - name: Restore .env from secret
        env:
          ENV_B64: ${{ secrets.ENV_B64 }}
        run: |
          if [ -n "$ENV_B64" ]; then
            echo "$ENV_B64" | base64 -d > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web verification
        run: flutter build web --release --no-tree-shake-icons
