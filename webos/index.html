<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <title>Nungu TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0F172A 0%, #080D1A 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 48px 64px;
      text-align: center;
      max-width: 900px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(229, 9, 20, 0.2);
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(229, 9, 20, 0.4);
    }
    h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 20px;
      margin-bottom: 36px;
    }
    .btn-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .btn {
      background: #1e293b;
      color: #ffffff;
      border: 2px solid transparent;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn:hover, .btn:focus {
      background: #E50914;
      transform: scale(1.05);
      border-color: #ffffff;
      box-shadow: 0 0 24px rgba(229, 9, 20, 0.6);
    }
    .btn-primary {
      background: #E50914;
    }
    .account-badge {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 16px;
      color: #94a3b8;
      display: inline-block;
      margin-top: 10px;
    }
    .account-badge b {
      color: #38bdf8;
    }
    .countdown {
      font-size: 16px;
      color: #64748b;
      margin-top: 20px;
    }
    .spinner {
      margin: 20px auto 0;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img src="largeIcon.png" class="logo" alt="Nungu TV">
    <h1>NUNGU TV</h1>
    <p class="subtitle">Smart TV Media Client for South Asian Cinema</p>

    <div class="btn-row">
      <button id="btnBrowse" class="btn btn-primary" autofocus onclick="launch('browse')">
        ▶ Watch Cinema
      </button>
      <button id="btnLogin" class="btn" onclick="launch('login')">
        🔑 Sign In (Auto-Fill)
      </button>
    </div>

    <div class="account-badge">
      Saved Account: <b>vishnu32510@gmail.com</b> &bull; Password: <b>WHeSHRA!u8mL3Xc</b>
    </div>

    <p id="timerText" class="countdown">Auto-launching in 3 seconds... (Press any key or click to cancel)</p>
    <div class="spinner"></div>
  </div>

  <script>
    var cancelled = false;
    var count = 3;

    function launch(target) {
      cancelled = true;
      if (target === 'login') {
        window.location.replace("https://einthusan.tv/login/?lang=tamil");
      } else {
        window.location.replace("https://einthusan.tv/movie/browse/?lang=tamil");
      }
    }

    // Cancel auto-launch on interaction
    window.addEventListener('keydown', function(e) {
      if (e.keyCode === 461) { // Back button
        if (window.close) window.close();
        return;
      }
      cancelled = true;
      var t = document.getElementById('timerText');
      if (t) t.textContent = "Auto-launch paused. Select an option using remote.";
      var spin = document.querySelector('.spinner');
      if (spin) spin.style.display = 'none';
    });

    // Auto-countdown to launch
    var interval = setInterval(function() {
      if (cancelled) {
        clearInterval(interval);
        return;
      }
      count--;
      var t = document.getElementById('timerText');
      if (count > 0) {
        if (t) t.textContent = "Auto-launching in " + count + " seconds...";
      } else {
        clearInterval(interval);
        launch('browse');
      }
    }, 1000);
  </script>
</body>
</html>
