<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>Einthusan TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #080D1A;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(229, 9, 20, 0.45);
      margin-bottom: 28px;
    }
    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .spinner {
      margin-top: 36px;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="largeIcon.png" class="logo" alt="Nungu TV">
  <h1>NUNGU TV</h1>
  <p>Connecting to Einthusan HD Cinema...</p>
  <div class="spinner"></div>

  <script>
    // LG webOS Remote Back Button handler (Key code 461)
    window.addEventListener('keydown', function(e) {
      if (e.keyCode === 461) {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      }
    });

    // Seamless top-level navigation to Einthusan
    setTimeout(function() {
      window.location.replace("https://einthusan.tv/movie/browse/?lang=tamil");
    }, 500);
  </script>
</body>
</html>
